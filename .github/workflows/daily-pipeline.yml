name: Daily data pipeline

# Render's free plan has no cron feature, so this is the scheduler in production:
# a free GitHub Actions workflow calling the deployed API's protected admin
# endpoint once a day. Locally, src/scheduler.py does the equivalent job in-process.

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Call /admin/run-pipeline
        run: |
          curl -sf -X POST "${{ secrets.API_BASE_URL }}/admin/run-pipeline" \
            -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
            --max-time 600
