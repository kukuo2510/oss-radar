name: Daily data pipeline

# Render's free plan has no cron feature, so this is the scheduler in production:
# a free GitHub Actions workflow calling the deployed API's protected admin
# endpoint once a day, one pipeline step per call. Locally, src/scheduler.py does
# the equivalent job in-process.
#
# One step per HTTP call (not one call that runs everything) is deliberate: a
# single request running all 6 steps back-to-back OOM'd a 512MB Render free
# instance. Splitting into separate requests keeps each one's peak memory bounded
# to whatever that single step needs, since the process gets a chance to release
# memory between requests.
#
# embed is called in a loop, not once: Render's free plan is also capped at 0.15
# vCPU, so embedding the entire backlog in one request can run past any reasonable
# timeout well before it runs out of memory. embed.py caps itself to ~15 items per
# call and reports how many are still pending; this loop just keeps calling until
# that hits 0 (or a safety cap, in case something's stuck).

on:
  schedule:
    - cron: "0 2 * * *" # 02:00 UTC daily
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab

jobs:
  trigger-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Ingest all sources
        run: |
          for step in arxiv github huggingface; do
            echo "=== running step: $step ==="
            curl -sf -X POST "${{ secrets.API_BASE_URL }}/admin/run-step/$step" \
              -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
              --max-time 250
            echo
          done

      - name: Embed (looped until backlog is drained)
        run: |
          for i in $(seq 1 40); do
            echo "=== embed pass $i ==="
            response=$(curl -sf -X POST "${{ secrets.API_BASE_URL }}/admin/run-step/embed" \
              -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
              --max-time 250)
            echo "$response"
            remaining=$(echo "$response" | jq -r '.remaining // 0')
            if [ "$remaining" -eq 0 ]; then
              echo "embedding backlog drained"
              break
            fi
          done

      - name: Classify and score trend
        run: |
          for step in classify trend; do
            echo "=== running step: $step ==="
            curl -sf -X POST "${{ secrets.API_BASE_URL }}/admin/run-step/$step" \
              -H "X-Admin-Token: ${{ secrets.ADMIN_TOKEN }}" \
              --max-time 250
            echo
          done
